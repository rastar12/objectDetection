<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Object detector</title>
    <meta charset="utf-8">
    <!-- Import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css">
  </head>  
  <body>
    <h1>Object detection using pre-trained model in TensorFlow.js</h1>
    <p>This is a simple object detection model using a pre-trained model in TensorFlow.js. It uses the coco-ssd model to detect objects in real-time using your webcam.</p>
    
    <section id="demos" class="invisible">
      <div id="liveView" class="camView">
        <button id="webcamButton">Enable Webcam</button>
        <video id="webcam" autoplay muted width="640" height="480"></video>
      </div>
    </section>

    <!-- Import TensorFlow.js library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js" type="text/javascript"></script>
    <!-- Load the coco-ssd model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <!-- Import the page's JavaScript -->
    <script src="script.js" defer></script>
  </body>
</html>
